name: 'AI Workflow Runner'
description: 'Run AI workflows with Node.js, Python, and Java runtime support'
author: 'TanNT'

inputs:
  workflow_path:
    description: 'Path to the workflow.md file (relative to workspace root). Required unless list_models is true.'
    required: false
    default: ''
  prompt:
    description: 'Input prompt to pass to the workflow (max 100KB)'
    required: false
    default: ''
  env_vars:
    description: 'JSON object of environment variables (max 64KB, 100 entries)'
    required: false
    default: '{}'
  timeout_minutes:
    description: 'Maximum execution time in minutes (default: 30)'
    required: false
    default: '30'
  validation_script:
    description: 'Optional validation script (file path like check.py or inline with prefix like python:print("ok")). Receives AI_LAST_MESSAGE env. Return empty/true for success, other string to continue workflow.'
    required: false
    default: ''
  validation_script_type:
    description: 'Script type for inline scripts: python or javascript. Auto-detected for file paths by extension (.py or .js). Only required when validation_script is set and type cannot be auto-detected.'
    required: false
    default: ''
  validation_max_retry:
    description: 'Maximum validation retry attempts when script returns non-empty/non-true (default: 5, max: 20)'
    required: false
    default: '5'
  opencode_config:
    description: 'Path to OpenCode config.json file (relative to workspace, or absolute under runner.temp/tmp). Contains provider and model settings.'
    required: false
    default: ''
  auth_config:
    description: 'Path to OpenCode auth.json file (relative to workspace, or absolute under runner.temp/tmp). Contains API keys and authentication. Store in GitHub Secrets, not Variables.'
    required: false
    default: ''
  model:
    description: 'Model to use for AI execution (e.g., "anthropic/claude-3-opus"). Overrides config file default.'
    required: false
    default: ''
  list_models:
    description: 'If "true", print available models and exit without running workflow'
    required: false
    default: 'false'
  disable_free_models:
    description: 'If "true", exclude genuinely-free models (cost 0 and not account-authenticated) from listings and fail fast if one would be run. Paid subscriptions with cost 0 (e.g. GitHub Copilot) are never affected.'
    required: false
    default: 'false'
  subscription_providers:
    description: 'Comma-separated provider IDs to always treat as paid subscriptions (their cost-0 models are never classified as free). Use for enterprise gateways or flat-subscription providers that OpenCode does not report as account-authenticated. E.g. "my-gateway,bedrock-custom". Default: empty.'
    required: false
    default: ''
  fallback_config:
    description: 'Path to a JSON file with an ordered provider/model fallback chain (relative to workspace, or absolute under runner.temp/tmp). Each entry is {provider, model}. IMPORTANT: this file must NOT contain credentials or API keys — auth is configured separately via auth_config.'
    required: false
    default: ''
  debug_log:
    description: 'Enable verbose debug logging to file. Also activated by ACTIONS_STEP_DEBUG=true or RUNNER_DEBUG=1.'
    required: false
    default: 'false'
  debug_log_path:
    description: 'Path for debug log file. Defaults to $RUNNER_TEMP/opencode-debug.log. Accepts workspace-relative or absolute paths under RUNNER_TEMP/tmp.'
    required: false
    default: ''
  export_transcript:
    description: 'If "true", export the full AI conversation to a JSON file after the run. Use the transcript_json_path output to upload it as a workflow artifact.'
    required: false
    default: 'false'
  write_job_summary:
    description: 'If "true", write a GitHub job summary with run status, token/cost totals, tool activity, and the final assistant message.'
    required: false
    default: 'false'
  transcript_path:
    description: 'Path for the transcript JSON file. Defaults to $RUNNER_TEMP/conversation.json. Accepts workspace-relative or absolute paths under RUNNER_TEMP/tmp.'
    required: false
    default: ''

  bash_allow_patterns:
    description: 'Comma or newline-separated list of additional bash command patterns to allow (e.g. "npm test*,npx*"). These are appended to the read-only default allow-set; the catch-all deny still applies. Default: empty (no extra patterns).'
    required: false
    default: ''
  agent_working_directory:
    description: 'Working directory for the agent (relative path within workspace). Confines agent filesystem access to this subtree. Default: workspace root ($GITHUB_WORKSPACE).'
    required: false
    default: ''
  allowed_provider_hosts:
    description: 'Comma-separated list of additional provider host globs permitted to receive credentials (e.g. "my-gateway.example.com,*.internal-ai.corp"). Extends the built-in allowlist. Default: empty (only built-in hosts allowed).'
    required: false
    default: ''
  webfetch_allowed_domains:
    description: 'Comma-separated list of domains the agent may webfetch (e.g. "github.com,docs.example.com"). Default: empty (webfetch fully denied). Security: each added domain widens the agent network surface; use the minimum necessary.'
    required: false
    default: ''

outputs:
  status:
    description: 'Execution status: success, failure, cancelled, or timeout'
  result:
    description: 'Workflow execution result as JSON string (max 900KB)'
  transcript_json_path:
    description: 'Resolved path of the exported transcript JSON file. Empty when export_transcript is false.'

runs:
  using: 'docker'
  image: 'docker://ghcr.io/arch-playground/ai-workflow-runner:v1'

branding:
  icon: 'play-circle'
  color: 'green'
