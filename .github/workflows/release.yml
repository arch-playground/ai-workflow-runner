name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

  resolve-version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_created: 'true'
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      patch: ${{ steps.version.outputs.patch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (v$VERSION)"

  publish-image:
    needs: [release-please, resolve-version]
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' || needs.resolve-version.outputs.release_created == 'true') &&
      !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.version || needs.resolve-version.outputs.version }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name || needs.resolve-version.outputs.tag_name }}
      MAJOR: ${{ needs.release-please.outputs.major || needs.resolve-version.outputs.major }}
      MINOR: ${{ needs.release-please.outputs.minor || needs.resolve-version.outputs.minor }}
      PATCH: ${{ needs.release-please.outputs.patch || needs.resolve-version.outputs.patch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arch-playground/ai-workflow-runner
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=v${{ env.VERSION }}
            type=raw,value=${{ env.MAJOR }}.${{ env.MINOR }},enable=${{ !contains(env.TAG_NAME, '-') }}
            type=raw,value=v${{ env.MAJOR }}.${{ env.MINOR }},enable=${{ !contains(env.TAG_NAME, '-') }}
            type=raw,value=${{ env.MAJOR }},enable=${{ !contains(env.TAG_NAME, '-') }}
            type=raw,value=v${{ env.MAJOR }},enable=${{ !contains(env.TAG_NAME, '-') }}
            type=raw,value=latest,enable=${{ !contains(env.TAG_NAME, '-') }}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-major-tag:
    needs: [release-please, resolve-version, publish-image]
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' || needs.resolve-version.outputs.release_created == 'true') &&
      !contains(needs.release-please.outputs.tag_name || needs.resolve-version.outputs.tag_name, '-') &&
      needs.publish-image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update major version tag
        env:
          MAJOR: ${{ needs.release-please.outputs.major || needs.resolve-version.outputs.major }}
          TAG: ${{ needs.release-please.outputs.tag_name || needs.resolve-version.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RELEASE_SHA=$(git rev-list -n 1 "${TAG}" 2>/dev/null || echo "${{ github.sha }}")
          git tag -fa "v${MAJOR}" "${RELEASE_SHA}" -m "Update v${MAJOR} to ${TAG}"
          git push origin "v${MAJOR}" --force
